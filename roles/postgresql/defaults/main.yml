---
# Defaults for roles/postgresql

# -------------------------------------------------------------------------
# Feature Toggles
# -------------------------------------------------------------------------
postgresql_install_packages: true
postgresql_manage_service: true
postgresql_service_state: started
postgresql_service_enabled: true
postgresql_manage_configuration: true
postgresql_manage_hba: true
postgresql_manage_ident: false
postgresql_manage_replication: false
postgresql_manage_databases: true
postgresql_manage_users: true
postgresql_manage_extensions: true
postgresql_manage_backup: true
postgresql_exporter_enabled: false
postgresql_pgbouncer_enabled: false

# -------------------------------------------------------------------------
# PostgreSQL Version and Upstream Repository
# -------------------------------------------------------------------------
postgresql_version: 16
postgresql_use_pgdg_repo: true
postgresql_apt_key_url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
postgresql_apt_key_path: "/etc/apt/keyrings/postgresql.gpg"
postgresql_apt_repo_url: "deb [signed-by={{ postgresql_apt_key_path }}] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"

# -------------------------------------------------------------------------
# Packages & System Paths
# -------------------------------------------------------------------------
postgresql_packages:
  - "postgresql-{{ postgresql_version }}"
  - "postgresql-client-{{ postgresql_version }}"
  - "postgresql-contrib-{{ postgresql_version }}"
  - "python3-psycopg2"

postgresql_extra_packages: []
postgresql_extension_packages: []

postgresql_user: "postgres"
postgresql_group: "postgres"
postgresql_config_dir: "/etc/postgresql/{{ postgresql_version }}/main"
postgresql_conf_d_dir: "{{ postgresql_config_dir }}/conf.d"
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/main"
postgresql_log_dir: "/var/log/postgresql"
postgresql_service_name: "postgresql"

# -------------------------------------------------------------------------
# Server Tuning & Configuration Parameters (conf.d/99-ansible-custom.conf)
# -------------------------------------------------------------------------
postgresql_listen_addresses: "localhost"
postgresql_port: 5432
postgresql_max_connections: 100
postgresql_superuser_reserved_connections: 3
postgresql_password_encryption: "scram-sha-256"

# Memory
postgresql_shared_buffers: "256MB"
postgresql_work_mem: "8MB"
postgresql_maintenance_work_mem: "64MB"
postgresql_effective_cache_size: "1GB"
postgresql_temp_buffers: "8MB"

# Write-Ahead Log (WAL) & Checkpoints
postgresql_wal_level: "replica"
postgresql_wal_buffers: "16MB"
postgresql_checkpoint_completion_target: 0.9
postgresql_checkpoint_timeout: "5min"
postgresql_min_wal_size: "1GB"
postgresql_max_wal_size: "4GB"

# Query Planner & Cost
postgresql_random_page_cost: 1.1
postgresql_effective_io_concurrency: 200
postgresql_default_statistics_target: 100

# Logging
postgresql_timezone: "UTC"
postgresql_log_destination: "stderr"
postgresql_logging_collector: false
postgresql_log_min_messages: "warning"
postgresql_log_min_error_statement: "error"
postgresql_log_min_duration_statement: -1
postgresql_log_line_prefix: "%m [%p] %q%u@%d "

# Shared Preload Libraries
postgresql_shared_preload_libraries:
  - "pg_stat_statements"

# pg_stat_statements defaults
postgresql_pg_stat_statements_max: 10000
postgresql_pg_stat_statements_track: "top"

# Additional arbitrary settings (key: value)
postgresql_custom_conf_parameters: {}

# -------------------------------------------------------------------------
# pg_hba.conf Authentication Rules
# -------------------------------------------------------------------------
postgresql_hba_default_rules:
  - type: "local"
    database: "all"
    user: "postgres"
    address: ""
    auth_method: "peer"
  - type: "local"
    database: "all"
    user: "all"
    address: ""
    auth_method: "scram-sha-256"
  - type: "host"
    database: "all"
    user: "all"
    address: "127.0.0.1/32"
    auth_method: "scram-sha-256"
  - type: "host"
    database: "all"
    user: "all"
    address: "::1/128"
    auth_method: "scram-sha-256"

# User-provided custom rules inserted before the default rules
postgresql_hba_custom_rules: []

# -------------------------------------------------------------------------
# pg_ident.conf Mapping Rules
# -------------------------------------------------------------------------
postgresql_ident_maps: []

# -------------------------------------------------------------------------
# Declarative Databases, Users & Extensions
# -------------------------------------------------------------------------
postgresql_databases: []
# - name: example_db
#   owner: example_user
#   encoding: UTF8
#   lc_collate: en_US.UTF-8
#   lc_ctype: en_US.UTF-8
#   state: present

postgresql_users: []
# - name: example_user
#   password: "{{ vault_example_user_password }}"
#   role_attr_flags: "CREATEDB,NOSUPERUSER"
#   db: example_db
#   priv: "ALL"
#   state: present

postgresql_extensions: []
# - name: vector
#   database: example_db
#   state: present

# -------------------------------------------------------------------------
# Streaming Replication (Primary / Standby)
# -------------------------------------------------------------------------
postgresql_replication_role: "standalone"  # "standalone" | "primary" | "standby"
postgresql_replication_user: "replicator"
postgresql_replication_password: ""
postgresql_replication_slot_name: "standby_slot"
postgresql_replication_primary_host: ""
postgresql_replication_primary_port: 5432
postgresql_max_wal_senders: 10
postgresql_max_replication_slots: 10

# -------------------------------------------------------------------------
# Automated Backup System (Systemd Service & Timer)
# -------------------------------------------------------------------------
postgresql_backup_dir: "/var/backups/postgresql"
postgresql_backup_type: "individual"  # "individual" (pg_dump each DB) or "all" (pg_dumpall)
postgresql_backup_retention_days: 7
postgresql_backup_calendar: "*-*-* 02:30:00"
postgresql_backup_exclude_databases:
  - "template0"
  - "template1"

# -------------------------------------------------------------------------
# Prometheus postgres_exporter
# -------------------------------------------------------------------------
postgresql_exporter_version: "0.16.0"
postgresql_exporter_port: 9187
postgresql_exporter_listen_address: "0.0.0.0"
postgresql_exporter_user: "postgres_exporter"
postgresql_exporter_password: ""
postgresql_exporter_arch: "amd64"
postgresql_exporter_binary_url: >-
  https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ postgresql_exporter_version }}/postgres_exporter-{{
  postgresql_exporter_version }}.linux-{{ postgresql_exporter_arch }}.tar.gz

# -------------------------------------------------------------------------
# PgBouncer Connection Pooler
# -------------------------------------------------------------------------
postgresql_pgbouncer_port: 6432
postgresql_pgbouncer_listen_addr: "*"
postgresql_pgbouncer_auth_type: "scram-sha-256"
postgresql_pgbouncer_auth_file: "/etc/pgbouncer/userlist.txt"
postgresql_pgbouncer_pool_mode: "transaction"
postgresql_pgbouncer_max_client_conn: 1000
postgresql_pgbouncer_default_pool_size: 20
postgresql_pgbouncer_reserve_pool_size: 5
postgresql_pgbouncer_admin_users:
  - "postgres"
postgresql_pgbouncer_stats_users:
  - "postgres"
postgresql_pgbouncer_users: []
# - username: app_user
#   password: "{{ vault_app_user_password }}"
#   auth_type: "scram-sha-256"
